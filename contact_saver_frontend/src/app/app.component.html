<!-- Top Navigation Bar -->
<nav class="navbar">
  <div class="navbar-title">
    <span class="navbar-icon">&#9742;</span>
    <span>{{ title }}</span>
  </div>
</nav>

<!-- Main App Area -->
<main class="container">
  <!-- Add Contact Form -->
  <form class="contact-form" autocomplete="off" (ngSubmit)="submitContact()">
    <div class="form-row">
      <input
        class="input"
        placeholder="Name"
        [(ngModel)]="form.name"
        name="name"
        required
        autocomplete="off"
      />
      <input
        class="input"
        placeholder="Email"
        type="email"
        [(ngModel)]="form.email"
        name="email"
        required
        autocomplete="off"
      />
      <input
        class="input"
        placeholder="Phone"
        [(ngModel)]="form.phone"
        name="phone"
        required
        autocomplete="off"
      />
      <button
        class="btn btn-primary"
        type="submit"
        [disabled]="submitting"
        aria-label="Add contact"
      >
        <span *ngIf="!submitting">Add</span>
        <span *ngIf="submitting" class="spinner"></span>
      </button>
    </div>
  </form>

  <!-- Error Message -->
  <div *ngIf="error" class="alert">
    <span>{{ error }}</span>
    <button class="close-alert" (click)="dismissError()" aria-label="Close">&times;</button>
  </div>

  <!-- Contacts List -->
  <section class="contacts-section">
    <div *ngIf="loading" class="loading-list">Loading contacts…</div>
    <div *ngIf="!loading && contacts.length === 0" class="empty">
      No contacts found.
    </div>
    <ul class="contact-list" *ngIf="!loading && contacts.length > 0">
      <li *ngFor="let contact of contacts" class="contact-item">
        <div class="contact-info">
          <span class="contact-avatar">{{ contact.name[0] | uppercase }}</span>
          <div class="contact-details">
            <div class="contact-name">{{ contact.name }}</div>
            <div class="contact-meta">
              <span class="contact-email">{{ contact.email }}</span>
              <span class="contact-phone">{{ contact.phone }}</span>
            </div>
          </div>
        </div>
        <button
          class="btn btn-accent"
          (click)="deleteContact(contact)"
          aria-label="Delete contact"
        >
          &#128465;
        </button>
      </li>
    </ul>
  </section>
</main>
